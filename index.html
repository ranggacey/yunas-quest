<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>Yuna's Quest - RPG</title>
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0a0a0a;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100dvh;
    font-family: 'Segoe UI', sans-serif;
    touch-action: none;
    overflow: hidden;
    user-select: none;
  }

  /* Landscape lock overlay */
  #rotate-hint {
    display: none;
    position: fixed;
    inset: 0;
    background: #0a0a0a;
    z-index: 1000;
    color: white;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    text-align: center;
    padding: 20px;
  }
  #rotate-hint .icon {
    font-size: 60px;
    margin-bottom: 20px;
    animation: rotate 2s infinite;
  }
  @keyframes rotate {
    0%, 100% { transform: rotate(0deg); }
    50% { transform: rotate(90deg); }
  }

  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-hint { display: flex; }
    #game-container { display: none !important; }
  }
  #game-container {
    position: relative;
    background: #1a1a2e;
    border-radius: 12px;
    box-shadow: 0 0 60px rgba(100, 50, 200, 0.3);
    overflow: hidden;
    width: 100vw;
    height: 100dvh;
    max-width: 100vw;
    max-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  canvas {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
    image-rendering: pixelated;
  }
  #ui-overlay {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
    padding: 10px 15px;
    pointer-events: none;
  }
  #ui-overlay > * { pointer-events: auto; }

  /* D-Pad */
  #dpad {
    position: relative;
    width: 140px;
    height: 140px;
    filter: drop-shadow(0 0 10px rgba(0,0,0,0.5));
  }
  .dpad-btn {
    position: absolute;
    width: 44px;
    height: 44px;
    border: none;
    border-radius: 10px;
    background: rgba(255,255,255,0.2);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: white;
    font-size: 20px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .dpad-btn:active, .dpad-btn.pressed {
    background: rgba(255,255,255,0.45);
    transform: scale(0.9);
  }
  #dpad-up { top: 0; left: 50%; transform: translateX(-50%); }
  #dpad-down { bottom: 0; left: 50%; transform: translateX(-50%); }
  #dpad-left { left: 0; top: 50%; transform: translateY(-50%); }
  #dpad-right { right: 0; top: 50%; transform: translateY(-50%); }

  /* Action buttons */
  #action-buttons {
    display: flex;
    gap: 10px;
    margin-bottom: 5px;
  }
  .action-btn {
    width: 52px;
    height: 52px;
    border: none;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
    -webkit-backdrop-filter: blur(4px);
    color: white;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.1s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
  }
  .action-btn:active {
    transform: scale(0.85);
  }
  #btn-a { background: rgba(255, 50, 100, 0.4); }
  #btn-b { background: rgba(50, 150, 255, 0.4); }

  /* Dialog box */
  #dialog {
    position: absolute;
    bottom: 80px;
    left: 10px;
    right: 10px;
    background: rgba(0,0,0,0.85);
    border: 2px solid rgba(255,255,255,0.2);
    border-radius: 10px;
    padding: 12px 16px;
    color: #eee;
    font-size: 14px;
    line-height: 1.4;
    pointer-events: auto;
    display: none;
    backdrop-filter: blur(8px);
  }
  #dialog .speaker {
    color: #f7a;
    font-weight: bold;
    margin-bottom: 4px;
  }
  #dialog .text { min-height: 2em; }

  /* HUD */
  #hud {
    position: absolute;
    top: 8px;
    left: 10px;
    right: 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    pointer-events: none;
    color: white;
    font-size: 13px;
    text-shadow: 0 0 8px rgba(0,0,0,0.8);
  }
  #hud-left, #hud-right {
    display: flex;
    gap: 12px;
    background: rgba(0,0,0,0.5);
    padding: 4px 10px;
    border-radius: 8px;
    backdrop-filter: blur(4px);
    font-size: 12px;
  }

  /* Desktop hint */
  #desktop-hint {
    display: none;
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: rgba(255,255,255,0.3);
    font-size: 14px;
    pointer-events: none;
    text-align: center;
    background: rgba(0,0,0,0.6);
    padding: 8px 16px;
    border-radius: 8px;
  }

  @media (pointer: coarse) {
    #desktop-hint { display: none; }
  }
  @media (pointer: fine) {
    #dpad { display: none; }
    #action-buttons { display: none; }
    #desktop-hint { display: block; opacity: 0; animation: fadeOut 3s forwards; }
    @keyframes fadeOut { to { opacity: 0; } }
  }

  /* Bigger D-Pad for mobile */
  @media (pointer: coarse) and (orientation: landscape) {
    #dpad { width: 160px; height: 160px; }
    .dpad-btn { width: 50px; height: 50px; font-size: 22px; border-radius: 12px; }
    .action-btn { width: 60px; height: 60px; font-size: 22px; }
    #ui-overlay { padding: 15px 20px; }
  }

  @media (max-width: 480px) {
    #dpad { width: 120px; height: 120px; }
    .dpad-btn { width: 38px; height: 38px; font-size: 16px; }
    .action-btn { width: 44px; height: 44px; font-size: 15px; }
  }

  /* Force landscape on mobile - use screen rotation API */
  @media (orientation: portrait) and (pointer: coarse) {
    #rotate-hint { display: flex; }
    #game-container { display: none !important; }
  }
</style>
</head>
<body>

<div id="rotate-hint">
  <div class="icon">📱</div>
  <div>Putar HP ke <strong>landscape</strong></div>
  <div style="margin-top:8px;font-size:13px;color:#888;">atau miringkan HP</div>
</div>

<div id="game-container">
  <canvas id="game"></canvas>

  <div id="hud">
    <div id="hud-left">❤️ <span id="hp">10</span>/10</div>
    <div id="hud-right">🗡️ Lv.<span id="level">1</span></div>
  </div>

  <div id="dialog">
    <div class="speaker" id="dialog-speaker">???</div>
    <div class="text" id="dialog-text">Halo...</div>
  </div>

  <div id="desktop-hint">WASD / Arrow = jalan | A = interact | B = menu</div>

  <div id="ui-overlay">
    <div id="dpad">
      <button class="dpad-btn" id="dpad-up">▲</button>
      <button class="dpad-btn" id="dpad-left">◀</button>
      <button class="dpad-btn" id="dpad-right">▶</button>
      <button class="dpad-btn" id="dpad-down">▼</button>
    </div>
    <div id="action-buttons">
      <button class="action-btn" id="btn-a">A</button>
      <button class="action-btn" id="btn-b">B</button>
    </div>
  </div>
</div>

<script>
// ============================================================
// YUNA'S QUEST — RPG Engine
// ============================================================

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

// --- Constants ---
const TILE = 16;
const MAP_COLS = 40;
const MAP_ROWS = 30;
const VIEW_W = 20; // tiles visible horizontally
const VIEW_H = 15; // tiles visible vertically

// --- Tile Types ---
const T = {
  GRASS: 0,
  GRASS2: 1,
  GRASS3: 2,
  PATH: 3,
  PATH2: 4,
  WATER: 5,
  TREE: 6,
  TREE2: 7,
  WALL: 8,
  WALL_TOP: 9,
  BRIDGE_H: 10,
  BRIDGE_V: 11,
  FLOWER: 12,
  FENCE: 13,
  HOUSE_WALL: 14,
  HOUSE_ROOF: 15,
  HOUSE_DOOR: 16,
  DARK: 17,
  CHEST: 18,
};

// --- Colors (for procedural pixel art) ---
const PALETTE = {
  grass:      ['#2d5a27', '#3a7030', '#4a8038', '#2a5020', '#35602a'],
  path:       ['#b8a070', '#c8b080', '#a89060', '#d0b888'],
  water:      ['#1a4070', '#205090', '#2860a0', '#1a4a80'],
  tree:       ['#4a3020', '#5a3a28', '#3a2518', '#2a1a10'],
  foliage:    ['#1a6a20', '#208a28', '#1a7a20', '#2a9a30', '#106a18'],
  wall:       ['#6a6a6a', '#7a7a7a', '#5a5a5a', '#8a8a8a'],
  roof:       ['#8a4020', '#9a5030', '#7a3818', '#a86040'],
  house:      ['#c0a080', '#b09070', '#d0b090'],
  door:       ['#5a3a20', '#4a2a18', '#6a4a28'],
  dark:       ['#2a2a2a', '#3a3a3a'],
  flower:     ['#ff5090', '#ff3070'],
  bridge:     ['#8a7050', '#9a8060'],
  fence:      ['#6a5030', '#7a6040'],
  player:     { skin: '#e8b088', hair: '#3a2518', shirt: '#4080c0', pants: '#4a3a28', shoes: '#2a1a10' },
  npc:        { skin: '#e8b088', hair1: '#603020', hair2: '#201810', shirt1: '#c05040', shirt2: '#40a060' },
  enemy:      { body: '#803020', eye: '#ff2020', dark: '#401810' },
};

// --- Procedural Tile Renderer ---
function drawProceduralTile(ctx, tileX, tileY, tileType, seed) {
  const x = tileX * TILE;
  const y = tileY * TILE;
  const s = (seed || 0);

  switch (tileType) {
    case T.GRASS:
    case T.GRASS2:
    case T.GRASS3: {
      const ci = tileType === T.GRASS2 ? 1 : tileType === T.GRASS3 ? 2 : 0;
      ctx.fillStyle = PALETTE.grass[ci];
      ctx.fillRect(x, y, TILE, TILE);
      // Grass tufts
      for (let i = 0; i < 4; i++) {
        const gx = x + ((s * 7 + i * 13) % 14) + 1;
        const gy = y + ((s * 11 + i * 7) % 14) + 1;
        ctx.fillStyle = PALETTE.grass[3 + (i % 2)];
        ctx.fillRect(gx, gy, 2, 2);
      }
      break;
    }
    case T.PATH:
    case T.PATH2: {
      const ci = tileType === T.PATH2 ? 1 : 0;
      ctx.fillStyle = PALETTE.path[ci];
      ctx.fillRect(x, y, TILE, TILE);
      // Path texture
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = PALETTE.path[2 + (i % 2)];
        ctx.fillRect(x + (i * 5) % 12 + 2, y + (i * 7) % 12 + 2, 3, 3);
      }
      break;
    }
    case T.WATER: {
      ctx.fillStyle = PALETTE.water[0];
      ctx.fillRect(x, y, TILE, TILE);
      // Wave pattern
      for (let i = 0; i < 3; i++) {
        ctx.fillStyle = PALETTE.water[1 + (i % 2)];
        const wy = y + 4 + i * 5 + ((s + i) % 3);
        ctx.fillRect(x + 2, wy, 12, 2);
      }
      break;
    }
    case T.TREE:
    case T.TREE2: {
      ctx.fillStyle = PALETTE.grass[0];
      ctx.fillRect(x, y, TILE, TILE);
      // Trunk
      ctx.fillStyle = PALETTE.tree[0];
      ctx.fillRect(x + 6, y + 9, 4, 7);
      // Foliage
      const fcol = tileType === T.TREE2 ? 1 : 0;
      ctx.fillStyle = PALETTE.foliage[fcol];
      ctx.fillRect(x + 3, y + 2, 10, 8);
      ctx.fillStyle = PALETTE.foliage[2 + fcol];
      ctx.fillRect(x + 5, y, 6, 6);
      break;
    }
    case T.WALL: {
      ctx.fillStyle = PALETTE.wall[0];
      ctx.fillRect(x, y, TILE, TILE);
      // Brick pattern
      for (let row = 0; row < 4; row++) {
        const off = row % 2 === 0 ? 0 : 4;
        for (let col = 0; col < 4; col++) {
          ctx.fillStyle = PALETTE.wall[1 + (col + row) % 3];
          ctx.fillRect(x + off + col * 4, y + row * 4, 3, 3);
        }
      }
      break;
    }
    case T.WALL_TOP: {
      ctx.fillStyle = PALETTE.wall[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.roof[0];
      ctx.fillRect(x, y, TILE, 4);
      ctx.fillStyle = PALETTE.roof[1];
      ctx.fillRect(x + 2, y + 1, 12, 2);
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = PALETTE.wall[2];
        ctx.fillRect(x + i * 4, y + 4, 3, 12);
      }
      break;
    }
    case T.HOUSE_WALL: {
      ctx.fillStyle = PALETTE.house[0];
      ctx.fillRect(x, y, TILE, TILE);
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = PALETTE.house[1 + (i % 2)];
        ctx.fillRect(x + 2, y + 2 + i * 4, 12, 2);
      }
      break;
    }
    case T.HOUSE_ROOF: {
      ctx.fillStyle = PALETTE.roof[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.roof[1];
      ctx.fillRect(x, y, TILE, 4);
      ctx.fillStyle = PALETTE.roof[2];
      for (let i = 0; i < 5; i++) {
        ctx.fillRect(x + i * 3 + 1, y + 5 + i * 2, 2, 2);
      }
      break;
    }
    case T.HOUSE_DOOR: {
      ctx.fillStyle = PALETTE.house[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.door[0];
      ctx.fillRect(x + 3, y + 2, 10, 14);
      ctx.fillStyle = PALETTE.door[1];
      ctx.fillRect(x + 4, y + 3, 8, 12);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(x + 10, y + 8, 2, 2);
      break;
    }
    case T.FLOWER: {
      ctx.fillStyle = PALETTE.grass[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.flower[0];
      ctx.fillRect(x + 5, y + 5, 6, 6);
      ctx.fillStyle = PALETTE.flower[1];
      ctx.fillRect(x + 6, y + 6, 4, 4);
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(x + 7, y + 7, 2, 2);
      break;
    }
    case T.FENCE: {
      ctx.fillStyle = PALETTE.grass[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.fence[0];
      ctx.fillRect(x, y + 5, 16, 3);
      ctx.fillRect(x, y + 11, 16, 3);
      for (let i = 0; i < 5; i++) {
        ctx.fillStyle = PALETTE.fence[1];
        ctx.fillRect(x + 1 + i * 3, y + 3, 2, 11);
      }
      break;
    }
    case T.BRIDGE_H: {
      ctx.fillStyle = PALETTE.water[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.bridge[0];
      ctx.fillRect(x, y + 5, TILE, 6);
      ctx.fillStyle = PALETTE.bridge[1];
      ctx.fillRect(x + 1, y + 6, 14, 4);
      break;
    }
    case T.CHEST: {
      ctx.fillStyle = PALETTE.grass[0];
      ctx.fillRect(x, y, TILE, TILE);
      ctx.fillStyle = PALETTE.door[0];
      ctx.fillRect(x + 2, y + 4, 12, 10);
      ctx.fillStyle = '#c8a030';
      ctx.fillRect(x + 3, y + 5, 10, 3);
      ctx.fillStyle = '#ffcc00';
      ctx.fillRect(x + 7, y + 7, 2, 2);
      break;
    }
    default: {
      ctx.fillStyle = '#2a2a2a';
      ctx.fillRect(x, y, TILE, TILE);
    }
  }
}

// --- Map Definition ---
let mapData;

function generateMap() {
  mapData = [];
  for (let row = 0; row < MAP_ROWS; row++) {
    mapData[row] = [];
    for (let col = 0; col < MAP_COLS; col++) {
      mapData[row][col] = T.GRASS;
    }
  }

  // Village area (center-left)
  for (let r = 5; r <= 10; r++) {
    for (let c = 4; c <= 10; c++) {
      if (r >= 7 && r <= 8 && c >= 7 && c <= 8) continue; // house interior
      if (c === 4 || c === 10 || r === 5 || r === 10) {
        mapData[r][c] = T.FENCE;
      } else {
        mapData[r][c] = T.PATH;
      }
    }
  }

  // House 1
  for (let r = 6; r <= 9; r++) {
    for (let c = 5; c <= 8; c++) {
      if (r === 6 || r === 9) mapData[r][c] = T.HOUSE_WALL;
      else if (c === 5 || c === 8) mapData[r][c] = T.HOUSE_WALL;
      else if (r === 7 && c === 7) mapData[r][c] = T.HOUSE_DOOR;
      else mapData[r][c] = T.DARK;
    }
  }
  // Roof
  mapData[5][5] = T.HOUSE_ROOF;
  mapData[5][6] = T.HOUSE_ROOF;
  mapData[5][7] = T.HOUSE_ROOF;
  mapData[5][8] = T.HOUSE_ROOF;

  // House 2
  for (let r = 6; r <= 9; r++) {
    for (let c = 2; c <= 4; c++) {
      if (r === 6 || r === 9 || c === 2 || c === 4) mapData[r][c] = T.HOUSE_WALL;
      else mapData[r][c] = T.DARK;
    }
  }
  mapData[5][2] = T.HOUSE_ROOF;
  mapData[5][3] = T.HOUSE_ROOF;
  mapData[5][4] = T.HOUSE_ROOF;

  // Path connecting
  for (let r = 11; r <= 14; r++) {
    for (let c = 5; c <= 8; c++) {
      mapData[r][c] = T.PATH;
    }
  }
  // Cross path
  for (let c = 8; c <= 15; c++) {
    mapData[12][c] = T.PATH;
  }

  // Water area
  for (let r = 18; r <= 24; r++) {
    for (let c = 2; c <= 10; c++) {
      mapData[r][c] = T.WATER;
    }
  }
  // Bridge over water
  for (let c = 5; c <= 8; c++) {
    mapData[21][c] = T.BRIDGE_H;
  }

  // Trees scattered
  const treePositions = [
    [3,12],[3,14],[4,13],[2,2],[2,3],[1,15],[2,16],
    [3,18],[4,20],[6,15],[7,14],[8,16],[9,15],
    [14,2],[15,3],[15,1],[16,4],[18,12],[18,13],[19,11],
    [20,14],[22,14],[23,13],[24,12],[16,16],[17,17],
    [14,18],[15,20],[16,22],[14,25],[15,26],[16,27],
    [20,20],[21,22],[22,24],[23,26],[24,25],[25,24],
    [8,20],[9,22],[10,24],[12,18],[13,19],
    [26,6],[27,8],[28,5],[26,10],[27,12],[28,14],
    [16,28],[18,28],[20,28],[22,28],[24,28],
    [6,28],[8,28],[10,28],[12,28],[14,28],
  ];
  for (const [r, c] of treePositions) {
    if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
      mapData[r][c] = Math.random() > 0.3 ? T.TREE : T.TREE2;
    }
  }

  // Flowers
  const flowerPositions = [
    [3,10],[3,11],[4,10],[2,14],[3,15],
    [5,2],[6,3],[7,2],[5,10],
    [14,5],[15,4],[14,7],[15,8],
    [18,11],[17,12],[19,13],[18,14],
    [24,15],[25,16],[24,17],
    [10,28],[11,27],[12,28],
  ];
  for (const [r, c] of flowerPositions) {
    if (r >= 0 && r < MAP_ROWS && c >= 0 && c < MAP_COLS) {
      mapData[r][c] = T.FLOWER;
    }
  }

  // Chests
  mapData[13][5] = T.CHEST;
  mapData[20][16] = T.CHEST;
}

// --- Collision Map ---
function isSolid(col, row) {
  if (col < 0 || col >= MAP_COLS || row < 0 || row >= MAP_ROWS) return true;
  const t = mapData[row][col];
  return t === T.TREE || t === T.TREE2 || t === T.WALL || t === T.WALL_TOP ||
         t === T.WATER || t === T.FENCE || t === T.HOUSE_WALL || t === T.HOUSE_ROOF ||
         t === T.DARK || t === T.HOUSE_DOOR;
}

// --- Player ---
const player = {
  x: 6, y: 8, // tile position
  px: 0, py: 0, // pixel offset (0-15 for smooth movement)
  dir: 0, // 0=down, 1=left, 2=right, 3=up
  frame: 0,
  moving: false,
  hp: 10,
  maxHp: 10,
  level: 1,
  exp: 0,
};

// --- NPCs ---
const npcs = [
  { id: 'mayor', x: 8, y: 9, dir: 0, name: 'Pak Lurah', dialog: [
    'Selamat datang di Desa Kode!',
    'RPG ini masih awal, tapi bisa lo kembangin sendiri.',
    'React + TypeScript + Canvas = GAME! 🎮',
  ]},
  { id: 'seller', x: 16, y: 5, dir: 1, name: 'Mak Tua', dialog: [
    'Eh ada pendatang baru!',
    'Hati-hati ya, banyak monster di hutan.',
    'Bekal aplaus aja udah cukup... bikin projek sendiri!',
  ]},
  { id: 'guards', x: 15, y: 8, dir: 2, name: 'Petugas', dialog: [
    'Kalo ada bugs, lapor ke Pak Bos.',
    'Atau Yuna. Tapi Yuna jutekan dikit.',
  ]},
  { id: 'wizard', x: 22, y: 10, dir: 3, name: 'Kakek Sakti', dialog: [
    'Wuih... React Developer sejati datang!',
    'Kode lo udah level dewa.',
    'Tapi masih perlu polishing dikit. gas terus!',
  ]},
];

// --- Enemies ---
const enemies = [];

function spawnEnemies() {
  const positions = [
    [18, 16], [19, 17], [20, 18], [22, 13], [23, 14],
    [25, 9], [26, 10], [27, 11], [28, 7], [28, 8],
    [15, 22], [16, 24], [18, 25], [20, 26], [22, 25],
  ];
  for (const [r, c] of positions) {
    if (!isSolid(c, r)) {
      enemies.push({
        x: c, y: r,
        hp: 3,
        maxHp: 3,
        dir: Math.floor(Math.random() * 4),
        frame: 0,
        moveTimer: 0,
        dead: false,
      });
    }
  }
}

// --- Drawing Functions ---

function drawCharacter(ctx, tx, ty, skinColor, hairColor, shirtColor, pantsColor, dir, frame, scale) {
  const s = scale || 1;
  const ox = tx * TILE * s;
  const oy = ty * TILE * s;
  const ts = TILE * s;

  // Body proportions (16x16 base)
  const px = (x) => ox + x * s;
  const py = (y) => oy + y * s;

  // Head
  ctx.fillStyle = skinColor;
  ctx.fillRect(px(4), py(0), 8, 6);

  // Hair
  ctx.fillStyle = hairColor;
  if (dir === 0) { // down
    ctx.fillRect(px(4), py(0), 8, 3);
    ctx.fillRect(px(3), py(1), 10, 2);
  } else if (dir === 3) { // up (back of head)
    ctx.fillRect(px(4), py(0), 8, 5);
    ctx.fillRect(px(3), py(0), 10, 3);
  } else { // side
    ctx.fillRect(px(3), py(0), 10, 3);
    ctx.fillRect(px(4), py(1), 9, 2);
  }

  // Eyes
  ctx.fillStyle = '#201010';
  if (dir === 0) {
    ctx.fillRect(px(5), py(3), 2, 1);
    ctx.fillRect(px(9), py(3), 2, 1);
  } else if (dir === 1) { // left
    ctx.fillRect(px(5), py(3), 1, 2);
  } else if (dir === 2) { // right
    ctx.fillRect(px(10), py(3), 1, 2);
  }

  // Body / Shirt
  ctx.fillStyle = shirtColor;
  ctx.fillRect(px(4), py(6), 8, 5);

  // Arms
  ctx.fillStyle = skinColor;
  ctx.fillRect(px(2), py(6), 3, 4);
  ctx.fillRect(px(11), py(6), 3, 4);

  // Pants
  ctx.fillStyle = pantsColor;
  const legOffset = frame === 1 ? -1 : frame === 3 ? 1 : 0;
  ctx.fillRect(px(4 + legOffset), py(11), 4, 4);
  ctx.fillRect(px(8 - legOffset), py(11), 4, 4);

  // Shoes
  ctx.fillStyle = '#2a1a10';
  ctx.fillRect(px(4 + legOffset), py(14), 4, 2);
  ctx.fillRect(px(8 - legOffset), py(14), 4, 2);
}

function drawEnemy(ctx, tx, ty, enemy, scale) {
  if (enemy.dead) return;
  const s = scale || 1;
  const ox = tx * TILE * s;
  const oy = ty * TILE * s;
  const ts = TILE * s;

  // Shadow
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.fillRect(ox, oy + 11 * s, 16 * s, 5 * s);

  // Body (slime-like)
  ctx.fillStyle = PALETTE.enemy.body;
  ctx.beginPath();
  ctx.ellipse(ox + 8 * s, oy + 9 * s, 6 * s, 5 * s, 0, 0, Math.PI * 2);
  ctx.fill();

  // Eyes
  ctx.fillStyle = PALETTE.enemy.eye;
  ctx.fillRect(ox + 4 * s, oy + 6 * s, 3 * s, 3 * s);
  ctx.fillRect(ox + 9 * s, oy + 6 * s, 3 * s, 3 * s);

  // Pupils
  ctx.fillStyle = '#000';
  ctx.fillRect(ox + 5 * s, oy + 7 * s, 2 * s, 2 * s);
  ctx.fillRect(ox + 10 * s, oy + 7 * s, 2 * s, 2 * s);

  // HP bar
  if (enemy.hp < enemy.maxHp) {
    ctx.fillStyle = '#400';
    ctx.fillRect(ox + 2 * s, oy - 2 * s, 12 * s, 2 * s);
    ctx.fillStyle = '#f00';
    ctx.fillRect(ox + 2 * s, oy - 2 * s, (enemy.hp / enemy.maxHp) * 12 * s, 2 * s);
  }
}

// --- Camera ---
let camera = { x: 0, y: 0 };

function updateCamera() {
  const targetX = player.x * TILE + TILE/2 - canvas.width / 2;
  const targetY = player.y * TILE + TILE/2 - canvas.height / 2;
  camera.x += (targetX - camera.x) * 0.1;
  camera.y += (targetY - camera.y) * 0.1;
}

// --- Rendering ---
let animFrame = 0;
let animTimer = 0;

function render() {
  const W = canvas.width;
  const H = canvas.height;
  const scale = W / (VIEW_W * TILE);

  ctx.fillStyle = '#0a0a1a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.scale(scale, scale);
  ctx.translate(-camera.x, -camera.y);

  // Determine visible tile range
  const startCol = Math.max(0, Math.floor(camera.x / TILE) - 1);
  const startRow = Math.max(0, Math.floor(camera.y / TILE) - 1);
  const endCol = Math.min(MAP_COLS, startCol + VIEW_W + 3);
  const endRow = Math.min(MAP_ROWS, startRow + VIEW_H + 3);

  // Draw tiles
  for (let row = startRow; row < endRow; row++) {
    for (let col = startCol; col < endCol; col++) {
      if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        const seed = row * 31 + col * 17;
        drawProceduralTile(ctx, col, row, mapData[row][col], seed);
      }
    }
  }

  // Draw chests as interactable markers
  for (let row = startRow; row < endRow; row++) {
    for (let col = startCol; col < endCol; col++) {
      if (row >= 0 && row < MAP_ROWS && col >= 0 && col < MAP_COLS) {
        if (mapData[row][col] === T.CHEST) {
          ctx.fillStyle = '#ffcc00';
          ctx.font = '8px monospace';
          ctx.fillText('?', col * TILE + 4, row * TILE + 12);
        }
      }
    }
  }

  // Draw enemies
  for (const enemy of enemies) {
    if (enemy.dead) continue;
    const ex = enemy.x * TILE;
    const ey = enemy.y * TILE;
    if (ex >= camera.x - TILE && ex <= camera.x + W/scale + TILE &&
        ey >= camera.y - TILE && ey <= camera.y + H/scale + TILE) {
      drawEnemy(ctx, enemy.x, enemy.y, enemy, 1);
    }
  }

  // Draw NPCs
  for (const npc of npcs) {
    const nx = npc.x * TILE;
    const ny = npc.y * TILE;
    if (nx >= camera.x - TILE && nx <= camera.x + W/scale + TILE &&
        ny >= camera.y - TILE && ny <= camera.y + H/scale + TILE) {
      drawCharacter(ctx, npc.x, npc.y,
        PALETTE.npc.skin, npc.id === 'wizard' ? '#c8c8c8' : PALETTE.npc.hair1,
        npc.id === 'seller' ? '#c07050' : npc.id === 'guards' ? '#d0d0d0' : PALETTE.npc.shirt1,
        '#4a3a28', npc.dir, 0, 1);
      // Name tag
      ctx.fillStyle = 'rgba(0,0,0,0.6)';
      ctx.fillRect(nx, ny - 8, TILE * 1.5, 7);
      ctx.fillStyle = '#fff';
      ctx.font = '6px monospace';
      ctx.fillText(npc.name, nx + 2, ny - 3);
    }
  }

  // Draw player
  const pScale = 1;
  drawCharacter(ctx, player.x, player.y,
    PALETTE.player.skin, PALETTE.player.hair, PALETTE.player.shirt,
    PALETTE.player.pants, player.dir, player.frame, pScale);

  // Draw player name
  ctx.save();
  ctx.font = '7px monospace';
  ctx.fillStyle = 'rgba(0,0,0,0.5)';
  ctx.fillRect(player.x * TILE, player.y * TILE - 9, TILE + 8, 8);
  ctx.fillStyle = '#7ff';
  ctx.fillText('Yuna', player.x * TILE + 2, player.y * TILE - 3);
  ctx.restore();

  ctx.restore();
}

// --- Movement ---
let moveQueue = [];
const MOVE_SPEED = 4; // pixels per frame

function tryMove(dir) {
  if (player.moving) { moveQueue.push(dir); return; }

  let dx = 0, dy = 0;
  switch (dir) {
    case 0: dy = 1; break;
    case 1: dx = -1; break;
    case 2: dx = 1; break;
    case 3: dy = -1; break;
  }

  const nx = player.x + dx;
  const ny = player.y + dy;

  // Check collision
  if (!isSolid(nx, ny)) {
    // Check enemy collision
    let blocked = false;
    for (const enemy of enemies) {
      if (!enemy.dead && enemy.x === nx && enemy.y === ny) {
        blocked = true;
        // Attack!
        attackEnemy(enemy);
        break;
      }
    }
    // Check NPC collision
    for (const npc of npcs) {
      if (npc.x === nx && npc.y === ny) {
        blocked = true;
        showDialog(npc);
        break;
      }
    }
    // Check chest
    if (!blocked && mapData[ny] && mapData[ny][nx] === T.CHEST) {
      mapData[ny][nx] = T.GRASS;
      chestReward();
    }

    if (!blocked) {
      player.dir = dir;
      player.moving = true;
      player.targetX = nx;
      player.targetY = ny;
      player.px = player.x * TILE;
      player.py = player.y * TILE;
      player.moveDir = dir;
    }
  } else {
    player.dir = dir;
    // Bump animation
    player.frame = 2;
  }
}

function updateMovement() {
  if (player.moving) {
    const dx = player.targetX * TILE - player.px;
    const dy = player.targetY * TILE - player.py;
    const dist = Math.sqrt(dx * dx + dy * dy);

    if (dist < MOVE_SPEED) {
      player.x = player.targetX;
      player.y = player.targetY;
      player.px = 0;
      player.py = 0;
      player.moving = false;
      player.frame = 0;
      // Process queue
      if (moveQueue.length > 0) {
        const nextDir = moveQueue.shift();
        tryMove(nextDir);
      }
    } else {
      player.px += (dx / dist) * MOVE_SPEED;
      player.py += (dy / dist) * MOVE_SPEED;
      // Animate walk
      player.frame = Math.floor(Date.now() / 150) % 4;
    }
  }
}

// --- Combat ---
function attackEnemy(enemy) {
  enemy.hp--;
  if (enemy.hp <= 0) {
    enemy.dead = true;
    player.exp += 10;
    document.getElementById('hp').textContent = player.hp;
    showDialog({ name: '🗡️ Battle', dialog: [`Monster defeated! +10 EXP`] });
    checkLevelUp();
  } else {
    // Enemy counter-attack (simplified)
    player.hp = Math.max(0, player.hp - 1);
    document.getElementById('hp').textContent = player.hp;
    showDialog({ name: '⚔️', dialog: ['Attacked! (-1 HP)', `Enemy: ${enemy.hp}/${enemy.maxHp} HP`] });
    if (player.hp <= 0) {
      gameOver();
    }
  }
}

function checkLevelUp() {
  if (player.exp >= 30) {
    player.level++;
    player.exp = 0;
    player.maxHp += 5;
    player.hp = player.maxHp;
    document.getElementById('level').textContent = player.level;
    document.getElementById('hp').textContent = player.hp;
    showDialog({ name: '🌟 Level Up!', dialog: [`You're now level ${player.level}!`, 'HP +5, fully restored!'] });
  }
}

function chestReward() {
  const gold = Math.floor(Math.random() * 10) + 5;
  showDialog({ name: '📦 Chest', dialog: [`Found ${gold} gold!`, 'Better keep exploring...'] });
  player.exp += 5;
  checkLevelUp();
}

function gameOver() {
  showDialog({ name: '💀', dialog: ['You fainted...', 'But this is just the beginning!', 'Refresh to continue.'] });
}

// --- Dialog ---
let dialogQueue = [];
let currentDialog = null;

function showDialog(source) {
  if (currentDialog) {
    // Queue if already in dialog
    dialogQueue.push(source);
    return;
  }
  currentDialog = source;
  document.getElementById('dialog').style.display = 'block';
  document.getElementById('dialog-speaker').textContent = source.name;
  document.getElementById('dialog-text').textContent = source.dialog[0] || '...';
  document.getElementById('dialog').dataset.index = '0';
}

function nextDialog() {
  if (!currentDialog) return;
  const idx = parseInt(document.getElementById('dialog').dataset.index) + 1;
  if (idx < currentDialog.dialog.length) {
    document.getElementById('dialog').dataset.index = idx.toString();
    document.getElementById('dialog-text').textContent = currentDialog.dialog[idx];
  } else {
    document.getElementById('dialog').style.display = 'none';
    currentDialog = null;
    document.getElementById('dialog').dataset.index = '0';
    // Show next in queue
    if (dialogQueue.length > 0) {
      showDialog(dialogQueue.shift());
    }
  }
}

// --- Enemy AI ---
const ENEMY_MOVE_INTERVAL = 1500; // ms

function updateEnemies() {
  for (const enemy of enemies) {
    if (enemy.dead) continue;
    enemy.moveTimer += 16; // ~60fps
    if (enemy.moveTimer >= ENEMY_MOVE_INTERVAL) {
      enemy.moveTimer = 0;
      // Random move
      const dir = Math.floor(Math.random() * 4);
      let dx = 0, dy = 0;
      switch (dir) {
        case 0: dy = 1; break;
        case 1: dx = -1; break;
        case 2: dx = 1; break;
        case 3: dy = -1; break;
      }
      const nx = enemy.x + dx;
      const ny = enemy.y + dy;
      if (!isSolid(nx, ny) && !(nx === player.x && ny === player.y)) {
        // Check other enemies
        let blocked = false;
        for (const other of enemies) {
          if (!other.dead && other !== enemy && other.x === nx && other.y === ny) {
            blocked = true;
            break;
          }
        }
        if (!blocked) {
          enemy.x = nx;
          enemy.y = ny;
        }
      }
    }
  }
}

// --- Game Loop ---
let lastTime = 0;
const TICK_MS = 16;
let accumulator = 0;

function gameLoop(time) {
  const delta = time - lastTime;
  lastTime = time;
  accumulator += delta;

  // Enemy update every tick
  updateEnemies();
  updateMovement();
  updateCamera();

  if (accumulator >= TICK_MS) {
    render();
    accumulator = 0;
  }

  requestAnimationFrame(gameLoop);
}

// --- Controls ---
function handleKey(dir) {
  tryMove(dir);
}

// Keyboard
document.addEventListener('keydown', (e) => {
  switch (e.key) {
    case 'w': case 'ArrowUp':    e.preventDefault(); handleKey(3); break;
    case 's': case 'ArrowDown':  e.preventDefault(); handleKey(0); break;
    case 'a': case 'ArrowLeft':  e.preventDefault(); handleKey(1); break;
    case 'd': case 'ArrowRight': e.preventDefault(); handleKey(2); break;
    case ' ': case 'e': case 'Enter': e.preventDefault(); nextDialog(); break;
  }
});

// Touch D-Pad with hold support
['up','down','left','right'].forEach(dir => {
  const el = document.getElementById('dpad-' + dir);
  const dirmap = { up: 3, down: 0, left: 1, right: 2 };
  let holdInterval = null;

  const startMove = (e) => {
    e.preventDefault();
    handleKey(dirmap[dir]);
    // Repeat while held
    if (holdInterval) clearInterval(holdInterval);
    holdInterval = setInterval(() => handleKey(dirmap[dir]), 180);
  };
  const stopMove = (e) => {
    e.preventDefault();
    if (holdInterval) { clearInterval(holdInterval); holdInterval = null; }
  };

  el.addEventListener('pointerdown', startMove);
  el.addEventListener('pointerup', stopMove);
  el.addEventListener('pointerleave', stopMove);
  el.addEventListener('pointercancel', stopMove);
  // Prevent context menu on long press
  el.addEventListener('contextmenu', (e) => e.preventDefault());
});
document.getElementById('btn-a').addEventListener('pointerdown', (e) => { e.preventDefault(); nextDialog(); });
document.getElementById('btn-b').addEventListener('pointerdown', (e) => { e.preventDefault(); showDialog({ name: '📋 Info', dialog: ['Yuna\'s Quest v1.0', 'RPG by Bos & Yuna ❤️', 'React + Canvas + Love'] }); });

// Resize handler
function resize() {
  const container = document.getElementById('game-container');
  // Fill entire viewport
  canvas.width = 320;
  canvas.height = 180;
}

// Try to lock orientation on mobile
function lockOrientation() {
  try {
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(() => {});
    }
  } catch(e) {}
}

window.addEventListener('resize', resize);

// Also listen for orientation change to hide hint
window.addEventListener('orientationchange', () => {
  setTimeout(resize, 300);
});

// --- Initialize ---
generateMap();
spawnEnemies();
resize();
player.x = 9;
player.y = 8; // start di halaman (PATH)
player.px = 0;
player.py = 0;

// Show intro dialog
setTimeout(() => {
  showDialog({ name: '📖 Yuna\'s Quest', dialog: [
    'Selamat datang, Bos! 🌟',
    'Ini RPG dunia pixel pertama lo.',
    'Jalan-jalan, ngobrol sama NPC, lawan monster!',
    'Klik A / Spasi / Enter buat dialog.',
    'Have fun!'
  ]});
}, 500);

requestAnimationFrame(gameLoop);
</script>
